name: Idea
description: Una funzione, un dispositivo da supportare, un modo migliore di rispondere da lontano. A feature, a device to support, a better way to answer from afar.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea / The idea
      description: Cosa vorresti e perché ti servirebbe. What you'd like and why it would help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS, Mac
      description: Versione di Nod, macOS, dispositivi (AirPods, Apple Watch). Nod version, macOS, devices (AirPods, Apple Watch).
